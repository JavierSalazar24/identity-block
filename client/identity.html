<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./dist/images/favicon.png"
      type="image/x-icon"
    />
    <link href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/libs/bootstrap/dist/css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="/libs/bootstrap-icons/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./css/main.css" />

    <title>Digital Identity</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark static-top">
      <div class="container">
        <a class="navbar-brand" href="./">
          <img
            src="./dist/images/logo.png"
            alt="Logo Identity Block"
            width="60px"
          />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="./">Home</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div class="row text-white">
        <div class="col-12">
          <form
            class="d-flex mb-3 align-items-center"
            role="search"
            id="searchForm"
            autocomplete="off"
          >
            <input
              class="form-control me-2 bg-dark text-white search"
              id="searchInput"
              type="search"
              placeholder="Search by personal ID..."
              aria-label="Search by personal ID..."
            />

            <button class="btn btn-dark me-1" type="submit">Search</button>
            <button class="btn btn-dark" type="reset">Reset</button>
          </form>
        </div>
        <div class="col-md-6 col-12 mb-4">
          <div class="card card-body mb-4 bg-dark">
            <h1><i class="bi bi-grid"></i> Identity Block</h1>
            <h6 class="text-secondary">
              Decentralized Digital Identity Application
            </h6>
            <br />
            <span
              ><i class="bi bi-wallet2"></i> Wallet: <span id="account"></span
            ></span>
            <p>
              <i class="bi bi-coin"></i> Balance: <span id="balance"></span> ETH
            </p>
          </div>

          <form class="card card-body bg-dark" id="identityForm">
            <h4 class="text-center">
              <i class="bi bi-person-badge"></i> Saves a new identity
            </h4>

            <div class="form-floating mb-2 mt-2">
              <input
                type="text"
                name="firstName"
                placeholder="Enter your first name"
                class="form-control bg-dark text-white inputs"
                id="firstNameInput"
                required
              />
              <label for="firstNameInput">Enter your first name</label>
            </div>

            <div class="form-floating mb-2">
              <input
                type="text"
                name="lastName"
                placeholder="Enter your last name"
                class="form-control bg-dark text-white inputs"
                id="lastNameInput"
                required
              />
              <label for="lastNameInput">Enter your last name</label>
            </div>

            <div class="form-floating mb-2">
              <input
                type="text"
                name="address"
                placeholder="Enter your address"
                class="form-control bg-dark text-white inputs"
                required
                id="addressInput"
              />
              <label for="addressInput">Enter your address</label>
            </div>

            <div class="form-floating mb-2">
              <input
                type="date"
                name="birthDay"
                placeholder="Enter your birth day"
                class="form-control bg-dark text-white inputs"
                required
                id="birthDayInput"
              />
              <label for="birthDayInput">Enter your birth day</label>
            </div>

            <div class="form-floating mb-2">
              <input
                type="text"
                name="personalId"
                placeholder="Enter your personal ID"
                class="form-control bg-dark text-white inputs"
                required
                id="personalIdInput"
              />
              <label for="personalIdInput">Enter your personal ID</label>
            </div>

            <button class="btn btn-primary">
              Save <i class="bi bi-save"></i>
            </button>
          </form>
        </div>
        <div class="col-md-6 col-12 mb-4">
          <div id="identitiesList"></div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="editModal"
      tabindex="-1"
      aria-labelledby="editModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <form class="modal-content" id="identityFormEdit">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="editModalLabel">Edit identity</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="idInputEdit" name="idEdit" />
            <div class="row">
              <div class="col-md-6 col-12">
                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    title="Required field / Letters only"
                    pattern="[a-zA-Zá-úÁ-Ú ]+"
                    placeholder="Enter your first name"
                    id="firstNameInputEdit"
                    name="firstNameEdit"
                    required
                  />
                  <label for="firstNameInputEdit">Enter your first name</label>
                </div>
              </div>
              <div class="col-md-6 col-12">
                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    title="Required field / Letters only"
                    pattern="[a-zA-Zá-úÁ-Ú ]+"
                    placeholder="Enter your last name"
                    id="lastNameInputEdit"
                    name="lastNameEdit"
                    required
                  />
                  <label for="lastNameInputEdit">Enter your last name</label>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 col-12">
                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    title="Required field"
                    placeholder="Enter your address"
                    id="addressInputEdit"
                    name="addressEdit"
                    required
                  />
                  <label for="addressInputEdit">Enter your address</label>
                </div>
              </div>

              <div class="col-md-6 col-12">
                <div class="form-floating mb-3">
                  <input
                    type="date"
                    class="form-control"
                    title="Required field"
                    placeholder="Enter your birth day"
                    id="birthDayInputEdit"
                    name="birthDayEdit"
                    required
                  />
                  <label for="birthDayInputEdit">Enter your birth day</label>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-12">
                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    title="Required field"
                    placeholder="Enter your personal ID"
                    id="personalIdInputEdit"
                    name="personalIdEdit"
                    required
                  />
                  <label for="lastNameInputEdit">Enter your personal ID</label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="submit" class="btn btn-success">
              <i class="bi bi-pencil-square"></i> Update
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- scripts -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator/qrcode.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvg/dist/browser/canvg.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.6.0/dist/web3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.22.2/moment.min.js"></script>
    <script src="/libs/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="./libs/@truffle/contract/browser-dist/truffle-contract.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    <script src="./js/app.js"></script>
    <script src="./js/ui.js"></script>
  </body>
</html>
