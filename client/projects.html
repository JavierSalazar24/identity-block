<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      rel="shortcut icon"
      href="./dist/images/favicon.png"
      type="image/x-icon"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/libs/bootstrap/dist/css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="/libs/bootstrap-icons/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./css/main.css" />
    <title>Digital projects</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark static-top">
      <div class="container">
        <a class="navbar-brand" href="./">
          <img
            src="./dist/images/logo.png"
            alt="Logo Identity Block"
            width="60px"
          />
        </a>
        <button
          class="navbar-toggler"
          id="btnNavbar"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="./">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./profiles.html">Profiles</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./projects.html">Projects</a>
            </li>
            <li class="nav-item" id="navLoginAdd"></li>
            <li class="nav-item dropdown" id="contLogin"></li>
            <li class="nav-item dropdown" id="navProfileLogout"></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container pb-5 pt-4">
      <div class="row text-white justify-content-center">
        <div class="col-12">
          <form
            class="d-flex mb-3 align-items-center"
            role="search"
            id="searchForm"
            autocomplete="off"
          >
            <input
              class="form-control me-2 bg-dark text-white search"
              id="searchInput"
              type="search"
              placeholder="Search by owner ID..."
              aria-label="Search by owner ID..."
            />

            <button class="btn btn-dark me-1" type="submit">Search</button>
            <button class="btn btn-dark" type="reset">Reset</button>
          </form>
        </div>

        <div class="col-4">
          <div class="form-floating projects_form mb-3">
            <select
              placeholder="Enter the status"
              class="form-control bg-dark text-white inputs"
              id="categorySearchInput"
            >
              <option value="All" selected>All</option>
              <option value="Software">Software</option>
              <option value="Video games">Video games</option>
              <option value="Applications">Applications</option>
              <option value="Architecture">Architecture</option>
              <option value="Design">Design</option>
              <option value="Marketing">Marketing</option>
            </select>
            <label for="categorySearchInput">Category:</label>
          </div>
        </div>

        <div class="col-4">
          <div class="form-floating projects_form mb-3">
            <select
              placeholder="Enter the status"
              class="form-control bg-dark text-white inputs"
              required
              id="statusSearchInput"
            >
              <option value="All" selected>All</option>
              <option value="Available">Available</option>
              <option value="Sold">Sold</option>
            </select>
            <label for="statusSearchInput">Enter the status</label>
          </div>
        </div>

        <div class="col-4">
          <div class="form-floating projects_form mb-2">
            <input
              type="number"
              name="price"
              placeholder="Price in ETH"
              step="any"
              class="form-control bg-dark text-white inputs"
              required
              id="priceSearchInput"
            />
            <label for="priceSearchInput">Price in ETH</label>
          </div>
        </div>

        <div class="col-md-8">
          <div id="projectsList"></div>
        </div>
      </div>
    </div>

    <!-- scripts -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.6.0/dist/web3.min.js"></script>
    <script src="./libs/@truffle/contract/browser-dist/truffle-contract.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/projects.js"></script>
    <script src="./js/uiprojects.js"></script>
  </body>
</html>
